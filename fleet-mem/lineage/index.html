agent evaluation; no repository repair","Agent Workflow Memory","Workflow extraction and reuse"],"synapse":["Stores examples of earlier agent trajectories and retrieves similar ones when a new task arrives. It is a memory-format foundation, not a code-memory gate.","Interactive/web agents","Interactive agent benchmarks; not repository repair","Synapse exemplar retrieval","Use of past trajectories versus no examples"],"swecl":["Groups software issues into chronological streams so researchers can measure learning across tasks, including improvement and forgetting.","Coding-memory benchmark","Ordered SWE-bench Verified issues","Continual evaluation framework with FAISS memory example","Task resolution, transfer, and forgetting"],"sweexp":["Extracts useful problem-solving experiences from earlier code repairs and retrieves them for new issues. Its aim is improving executable patch success.","Repository repair","SWE-bench issue tasks","SWE-Search; DeepSeek-V3-0324 and Claude-4-Sonnet","Experience extraction, reranking and issue-resolution ablations"],"memr1":["Trains a memory manager on what to save and an answering model on how to use saved information. Its tests are dialogue question answering, not coding repairs.","Conversation and QA","LoCoMo; MSC; LongMemEval","RL-trained memory manager and answer agent","QA quality and transfer with learned write/use decisions"],"reasoning":["After tasks succeed or fail, the system distills concise lessons for later tasks and retrieves relevant lessons. It tests reuse on real software issues as well as other agent tasks.","Coding and general agents","SWE-bench Verified; WebArena","ReAct-style agent with ReasoningBank","Memory on/off, memory extraction and test-time scaling"],"sedm":["Separates decisions about which experiences to share from whether a recipient should use them. The recipient gate learns to predict success with versus without memory and considers its token cost.","Shared QA-agent memory","LoCoMo; FEVER; HotpotQA","GP mop":["Runs coding tasks with and without candidate memories to see which ones improve performance. Those results train a model to write better memories for future tasks.","Repository software engineering","SWE-bench Verified repositories","Coding worker and trained memory writer","Paired memory effects, memory acceptance and downstream repair"],"learnshare":["Trains a policy for deciding what a team of agents should put in shared memory. The experiments concern agent teamwork, not sequential GitHub repair.","Multi-agent collaboration","GAIA; AssistantBench","RL-driven shared-memory admission","Sharing-policy comparisons on general agent tasks"],"org":["Describes how organizations can capture, curate, and distribute useful coding knowledge between sessions and agents. It is mainly a systems/deployment line of work.","Enterprise coding agents","Enterprise coding setting; public benchmark details not verified","Organizational memory pipeline","System/deployment study; isolated memory effects not verified"],"distill":["A powerful teacher agent produces reusable workflows and tool-use guidance for smaller agents. This tests transfer between agent capabilities, not historical GitHub fixes.","Tool-use agents","AppWorld; BFCL V3; ToolSandbox","Teacher-to-student hierarchical memory","Workflow/subtask/function memory transfer"],"memguard":["Checks how trustworthy a memory is before storing it, then uses that evidence to retrieve, update, or retire the memory. It reports executable repository-repair results.","Coding and interactive agents","SWE-bench Verified; Terminal-Bench 2; WebArena; Mind2Web","ReAct-style worker; Qwen3.5 and Gemini backbones","No memory vs ReasoningBank vs verifier-only vs full governance"],"retain":["Trains write and retrieval gates during multi-agent collaboration. It tests code-generation questions, not past knowledge shared between separate repo repairs.","Multi-agent reasoning and code generation","GSM-Hard; MATH; HumanEval; MBPP; MMLU-Pro","Frozen LLM agents with learned memory routers","Write/retrieval-gate ablations; accuracy and cost"],"vibe":["Runs the same repository task with and without a historical memory and tests whether the patch works. Its selected tasks already had a useful memory for a reference agent.","Coding-memory benchmark","111 targets, 90 SWE-rebench V2 repos, 3,634 histories","MiniSWEAgent; reference and transfer solvers","Paired memory effects, four seeds and cross-model transfer"],"jev":["Uses a fast controller to decide which parts of a memory graph to search and when to stop retrieving. It was not tested on repository repair.","Conversation memory retrieval","LoCoMo and memory QA","System-One graph-memory controller","Retrieval effectiveness, efficiency and stopping"],"scope":["Shows why a code-repair lesson that works for one task family can hurt other families if made global. It tests restricting reuse to supported families.","Controlled code-repair streams","ProcStream-RSI v3.1 synthetic repair families","Gated persistent policies and hidden-test evaluator","Global versus family-scoped reuse, gate ablations"],"aecg":["Tracks evidence, applicability, and changing reliability for shared agent experiences, so stale or harmful ones can be revised or withheld.","General multi-agent systems","Multi-agent benchmarks; exact list not independently verified","AutoGen / MacNet / AgentNet; GPT-4.1-mini worker","Multi-framework governance comparisons"],"chronos":["Converts earlier pull requests into linked cards about how the repository evolved. A coding agent retrieves those cards to guide future fixes and features.","Repository evolution and coding","SWE-bench Verified; SWE-bench Pro public; FEA-Bench Lite","SWE-Agent with PR knowledge graph","Six-model issue resolution and graph/retrieval ablations"],"sepm":["Provides a shared task graph and blackboard for collaborating agents, and learns procedures from their activity. It addresses coordination more than future code repair.","Multi-agent  positions[id]={x:px,y:py,cx:px+cardW/2,cy:py+cardH/2,w:cardW,h:cardH,lane:lane.key};
 totals[id]=lane.color;
 });
 });
 y+=lane.height+10;
}
if(Object.keys(positions).length!==33)throw Error("Missing node layout");
function pathData(a,b){
 const x1=a.cx,y1=a.cy,x2=b.cx,y2=b.cy;
 // Keep arrow points outside rounded rectangles; endpoints adapt to lane direction.
 const sy=y2>=y1?a.y+a.h:a.y, ty=y2>=y1?b.y:b.y+b.h;
 if(Math.abs(a.cy-b.cy)<75){
 const ax=a.x+a.w, bx=b.x;
 return "M "+ax+" "+a.cy+" C "+(ax+26)+" "+(a.cy-55)+" "+(bx-26)+" "+(b.cy-55)+" "+bx+" "+b.cy;
 }
 return "M "+a.cx+" "+sy+" C "+a.cx+" "+((sy+ty)/2)+" "+b.cx+" "+((sy+ty)/2)+" "+b.cx+" "+ty;
}
E.forEach((e,i)=>{
 const a=positions[e.source],b=positions[e.target];
 const el=make("path",{d:pathData(a,b),class:"path"+(a.lane===b.lane?" local":""),"data-source":e.source,"data-target":e.target},edgesG);
 paths.push({el,source:e.source,target:e.target});
});
const palette={origin:["#ffffff","#9baec3"],coding:["#ffffff","#93bbd4"],governor:["#ffffff","#e0b88d"],evaluation:["#ffffff","#a5cfc4"],other:["#ffffff","#baaedb"]};
for(const lane of lanes)for(const id of lane.ids){
 const n=N[id],p=positions[id],g=make("g",{class:"paper",tabindex:"0",role:"button","aria-label":n.title+", "+n.venue,"data-paper":id},nodesG);
 make("rect",{x:p.x,y:p.y,width:p.w,height:p.h,rx:9,fill:palette[lane.key][0],stroke:palette[lane.key][1]},g);
 const name=n.short;
 const charLimit=22;
 const label=name.length>charLimit?name.slice(0,charLimit-1)+"…":name;
 put(make("text",{x:p.x+12,y:p.y+26,class:"paper-name"},g),label);
 put(make("text",{x:p.x+12,y:p.y+48,class:"paper-venue"},g),n.venue.replace("Preprint · 2026 rev.","Preprint 2026").slice(0,27));
 g.addEventListener("pointerenter",ev=>show(id,ev));
 g.addEventListener("pointermove",ev=>place(ev));
 g.addEventListener("pointerleave",()=>hide());
 g.addEventListener("focus",()=>show(id,null));
 g.addEventListener("blur",()=>hide());
 g.addEventListener("click",ev=>{ev.stopPropagation();show(id,ev)});
 g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();show(id,null)}});
 cards[id]=g;
}
let active=null;
const escapeHTML=v=>String(v??"Not verified").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(id,ev){
 const n=N[id],d=D[id]||[];
 active=id;
 const parents=E.filter(e=>e.target===id).length,children=E.filter(e=>e.source===id).length;
 const fields=[["Domain",d[1]],["Dataset",d[2]],["Harness",d[3]],["Experiments",d[4]],["Publication",n.venue]];
 tt.innerHTML='<div class="tt-title">'+escapeHTML(n.title)+'</div><div class="tt-venue">'+escapeHTML(n.venue)+'</div><p class="tt-intro">'+escapeHTML(d[0]||n.note)+'</p><dl>'+fields.map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+escapeHTML(v)+'</dd></div>').join("")+'</dl><div class="tt-bottom">Cites '+parents+' papers in this map · Cited by '+children+' included papers · <a href="'+encodeURI(n.url)+'" target="_blank" rel="noopener">Paper ↗</a></div>';
 tt.classList.add("show");
 const connected=new Set([id]);
 for(const edge of paths){
 const incoming=edge.target===id, outgoing=edge.source===id;
 edge.el.classList.toggle("hot-in",incoming);
 edge.el.classList.toggle("hot-out",outgoing);
 edge.el.classList.toggle("dim",!incoming&&!outgoing);
 edge.el.removeAttribute("marker-end");
 if(incoming){connected.add(edge.source);edge.el.setAttribute("marker-end","url(#arrow-in)");edgesG.appendChild(edge.el)}
 if(outgoing){connected.add(edge.target);edge.el.setAttribute("marker-end","url(#arrow-out)");edgesG.appendChild(edge.el)}
 }
 for(const [key,g]of Object.entries(cards)){
 g.classList.toggle("dim",!connected.has(key));
 g.classList.toggle("focused",key===id);
 g.classList.toggle("related",key!==id&&E.some(e=>e.target===id&&e.source===key));
 g.classList.toggle("source",key!==id&&E.some(e=>e.source===id&&e.target===key));
 }
 place(ev);
}
function place(ev){
 if(!active)return;
 let x,y;
 if(ev&&typeof ev.clientX==="number"&&ev.pointerType!=="touch"){
 x=ev.clientX+16;y=ev.clientY+16;
 }else{const r=cards[active].getBoundingClientRect();x=r.right+15;y=r.top}
 const w=tt.offsetWidth,h=tt.offsetHeight;
 x=Math.max(8,Math.min(x,window.innerWidth-w-8));
 y=Math.max(8,Math.min(y,window.innerHeight-h-8));
 tt.style.left=x+"px";tt.style.top=y+"px";
}
function hide(){
 active=null;tt.classList.remove("show");
 for(const edge of paths){edge.el.classList.remove("hot-in","hot-out","dim");edge.el.removeAttribute("marker-end")}
 for(const g of Object.values(cards))g.classList.remove("dim","focused","related","source");
}
const initial={x:0,y:0,w:2180,h:1190};
const view={...initial};
function setView(){svg.setAttribute("viewBox",[view.x,view.y,view.w,view.h].join(" "))}
function point(ev){const box=svg.getBoundingClientRect();return{x:view.x+(ev.clientX-box.left)/box.width*view.w,y:view.y+(ev.clientY-box.top)/box.height*view.h}}
function zoom(factor,ev){
 const box=svg.getBoundingClientRect(),px=ev?ev.clientX:box.left+box.width/2,py=ev?ev.clientY:box.top+box.height/2;
 const before=point({clientX:px,clientY:py});
 const ratio=window.innerWidth/window.innerHeight;
 const nw=Math.max(500,Math.min(6600,view.w*factor)),nh=view.h*(nw/view.w);
 const afterX=(px-box.left)/box.width* nw,afterY=(py-box.top)/box.height*nh;
 view.x=before.x-afterX;view.y=before.y-afterY;view.w=nw;view.h=nh;setView();if(active)hide();
}
let pan=null;
svg.addEventListener("pointerdown",ev=>{if(ev.target.closest(".paper"))return;hide();pan={x:ev.clientX,y:ev.clientY,ox:view.x,oy:view.y};svg.classList.add("is-panning");svg.setPointerCapture(ev.pointerId)});
svg.addEventListener("pointermove",ev=>{if(!pan)return;const box=svg.getBoundingClientRect();view.x=pan.ox-(ev.clientX-pan.x)*view.w/box.width;view.y=pan.oy-(ev.clientY-pan.y)*view.h/box.height;setView()});
svg.addEventListener("pointerup",()=>{pan=null;svg.classList.remove("is-panning")});
svg.addEventListener("pointercancel",()=>{pan=null;svg.classList.remove("is-panning")});
svg.addEventListener("wheel",ev=>{ev.preventDefault();zoom(ev.deltaY<0?.9:1.1,ev)},{passive:false});
svg.addEventListener("click",ev=>{if(!ev.target.closest(".paper"))hide()});
document.getElementById("zin").onclick=()=>zoom(.8);
document.getElementById("zout").onclick=()=>zoom(1.25);
document.getElementById("fit").onclick=()=>{Object.assign(view,initial);setView();hide()};
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")hide()});
setView();
</script></body></html>
