{% include base_path %}
<header class="site-header">
  <nav class="site-header__inner" aria-label="Primary navigation">
    <a class="site-header__brand" href="{{ '/' | relative_url }}" aria-label="Vedant Borkute — home">Vedant Borkute<span class="site-header__dot">.</span></a>
    <div class="site-header__links">
      {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </div>
  </nav>
</header>
