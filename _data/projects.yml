# Single source of truth for every project on the site.
# - featured: true  -> shows on the homepage (keep it to ~4)
# - area            -> groups cards on /projects/ (must match an id in `areas` below)
# - links           -> first link is the primary call to action
# Add a project here once; the homepage and /projects/ update together.

areas:
  - id: agents
    label: Agents & memory
  - id: safety
    label: AI safety & security
  - id: ml
    label: Applied ML & vision
  - id: data
    label: Data systems & forecasting

projects:
  - title: Who gets to remember?
    eyebrow: Multi-agent memory · active research
    area: agents
    year: 2026
    featured: true
    summary: >-
      Shared-memory governance for coding-agent fleets. Separates write admission
      (SHARE / DO_NOT_SHARE) from read exposure (EXPOSE / WITHHOLD) on SWE-ContextBench,
      with seven preregistered paired arms.
    result: "Negative result so far: tested memory conditions did not beat a no-memory baseline."
    links:
      - { label: Research note, url: /fleet-mem/ }
      - { label: Lineage audit, url: /fleet-mem/lineage/ }
      - { label: Pilot code, url: "https://github.com/Vedant2100/agent-fleet-memory-governance" }
      - { label: Summary repo, url: "https://github.com/Vedant2100/coding-agent-mem" }

  - title: Does memory help coding agents?
    eyebrow: Benchmark audit · paper draft
    area: agents
    year: 2026
    featured: true
    summary: >-
      An audit of the FrontierMemory benchmark: an agent gets notes distilled from ~750
      past runs, then solves 15 held-out tasks graded by hidden tests.
    result: "Memory did not help by a measurable amount — and the reasons are the interesting part."
    links:
      - { label: Read the audit, url: "https://github.com/Vedant2100/frontiermemory-learning" }

  - title: EvoMemBench held-out study
    eyebrow: Controlled memory experiments
    area: agents
    year: 2026
    summary: >-
      Can a frozen agent turn earlier experience into gains on later ALFWorld tasks?
      Reuses the official EvoMemBench evaluator and adds a strict train/test held-out protocol.
    links:
      - { label: GitHub, url: "https://github.com/Vedant2100/evo-mem-bench" }

  - title: SkillFalsifier
    eyebrow: Agent evaluation · hackathon
    area: agents
    year: 2026
    featured: true
    summary: >-
      A falsification gate for self-improving agents: a generated skill must transfer to
      held-out and adversarial cases before it is promoted into the playbook.
    links:
      - { label: Live demo, url: /skillfalsifier/ }
      - { label: Write-up, url: /posts/skillfalsifier/ }
      - { label: GitHub, url: "https://github.com/Vedant2100/skillfalsifier" }

  - title: ReplayGate
    eyebrow: Continual learning
    area: agents
    year: 2026
    summary: >-
      A small, reproducible experiment on real UCI handwriting data comparing online
      learning, rehearsal replay, and retrieval memory — what survives when a model learns something new.
    links:
      - { label: Interactive results, url: /replaygate/ }
      - { label: Write-up, url: /posts/continual-agent-learning/ }

  - title: Terminal DreamGym
    eyebrow: Agent training · hackathon
    area: agents
    year: 2026
    summary: >-
      A local wind tunnel for self-improving terminal agents: failures become practice
      worlds, and recovery skills are tested on held-out and adversarial tasks.
    links:
      - { label: GitHub, url: "https://github.com/Vedant2100/terminal_dreamgym" }

  - title: RL CodeLab
    eyebrow: Reinforcement learning
    area: agents
    year: 2026
    summary: >-
      Can a Dueling DQN stabilize recursive self-improvement of code? A Colab experiment
      with calibration and held-out measurements.
    links:
      - { label: Write-up, url: /posts/rl-codelab-rsi/ }

  - title: Comparing LLM reasoning strategies
    eyebrow: AI for navigation
    area: agents
    year: 2026
    summary: >-
      Reactive, ReAct, Chain-, Tree- and Buffer-of-Thought in MiniGrid with
      Qwen2.5-7B-Instruct, tracking success, exploration, and token usage.
    result: "Up to 55% success on LavaGapS6 and 20% on LavaCrossingS9N2."
    links:
      - { label: GitHub, url: "https://github.com/Vedant2100/w26/tree/main/CS_228" }

  - title: Agent governance at runtime
    eyebrow: CompFly AI · research internship
    area: safety
    year: 2026
    featured: true
    summary: >-
      Reproducible evaluations for prompt-injection and high-stakes tool use, lightweight
      detection pipelines, and OpenTelemetry traces across agent turns, tool calls, handoffs, and cost.
    links:
      - { label: Technical write-up, url: "https://compfly.ai/resources/blog/agentdojo" }

  - title: Prompt-injection classifier audit
    eyebrow: Safety evaluation
    area: safety
    year: 2026
    summary: >-
